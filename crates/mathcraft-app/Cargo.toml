[package]
name = "mathcraft-app"
default-run = "mathcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mathcraft_ui"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Explicit native-window diagnostic; omitted from ordinary builds.
native-profile = ["eframe/glow"]

[[bin]]
name = "mathcraft"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
mathcraft-core.workspace = true
mathcraft-document.workspace = true
mathcraft-compat.workspace = true
mathcraft-editor = { path = "../mathcraft-editor" }
egui_plot.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
roxmltree.workspace = true
skrifa = "0.44"
harfrust = "0.12"
flate2 = "1"

[dev-dependencies]
zip.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { workspace = true, features = ["wgpu"] }

[target.'cfg(all(not(windows), not(target_arch = "wasm32")))'.dependencies]
eframe = { workspace = true, features = ["glow"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
serde-wasm-bindgen = "0.6"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "Performance"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
