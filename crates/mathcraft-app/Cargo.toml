[package]
name = "mathcraft-app"
default-run = "mathcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mathcraft_ui"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Explicit native-window diagnostic; omitted from ordinary builds.
native-profile = ["eframe/glow"]

[[bin]]
name = "mathcraft"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
mathcraft-core.workspace = true
mathcraft-document.workspace = true
mathcraft-compat.workspace = true
mathcraft-editor = { path = "../mathcraft-editor" }
rfd.workspace = true
egui_plot.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
roxmltree.workspace = true
skrifa = "0.44"
harfrust = "0.12"
flate2 = "1"

[dev-dependencies]
zip.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { workspace = true, features = ["wgpu"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { workspace = true, features = ["glow"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
